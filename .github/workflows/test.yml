name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Stress ASR cache concurrency
        run: go test ./internal/asr -run 'TestResolveLocalASRCacheDirConcurrentAdoptionConverges|TestLocalASRCacheConcurrentProcessesConverge' -count=20
      - run: go test ./...
      - if: runner.os == 'Linux' || runner.os == 'macOS'
        run: bash scripts/test-install.sh
      - if: runner.os == 'Linux'
        run: |
          bash scripts/test-digcrawl-cdp-browser-service.sh
          bash scripts/test-digcrawl-watchlist-service.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-digcrawl-cdp-browser-service.ps1
          ./scripts/test-digcrawl-watchlist-service.ps1
