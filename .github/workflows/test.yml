name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: bash scripts/test-digcrawl-cdp-browser-service.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-digcrawl-cdp-browser-service.ps1
