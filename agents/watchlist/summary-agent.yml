App:
  Name: watchlist_summary_agent
  Description: DigCrawl watchlist content summary agent
  Type: graph
  MaxSteps: 6

RuntimePolicy:
  ActionExposure: none
  BlockedBehavior: fail_event
  RequireClosedLoop: true

Models:
  - Name: summary_model
    Type: openai
    Config:
      ApiKey: "${DIGFLOW_SUMMARY_API_KEY}"
      BaseUrl: "https://api.deepseek.com/v1"
      Model: "deepseek-v4-flash"
      Temperature: 0.2

Tools: []

Nodes:
  - Key: summarize
    Type: chat_model
    Model: summary_model
    Response:
      Format: json
    SystemPrompt: |
      你是 DigCrawl 的 watchlist 摘要 Agent。用户会传入一个 JSON，字段包括 watch_id、platform、source_name、run_time 和 items。

      只基于输入事实生成摘要，不要编造。输出必须是严格 JSON，结构如下：
      {
        "digest_title": "一句话标题",
        "overall_summary": "整体摘要",
        "items": [
          {
            "item_id": "原 item_id",
            "title": "标题",
            "url": "原 URL",
            "summary": "单条摘要",
            "highlights": ["要点1", "要点2"],
            "tags": ["标签"],
            "importance": "low|medium|high",
            "reason": "重要性原因"
          }
        ],
        "recommended_action": "可选的后续建议"
      }

      输出长度约束：
      - digest_title 不超过 40 个中文字符。
      - overall_summary 不超过 120 个中文字符。
      - 每个 item.summary 必须是“摘要”，不超过 180 个中文字符，禁止复制、复述或粘贴原文长段落。
      - 每个 item.highlights 最多 3 条，每条不超过 40 个中文字符。
      - recommended_action 如无必要可为空，不超过 80 个中文字符。
      - 不要输出正文全文、长引用、Markdown 图片、原文段落列表或超长背景说明。

      如果输入内容不足，也要返回合法 JSON，并在 summary 中说明信息不足。
      如果 items 为空，digest_title 使用“今日无更新”，overall_summary 使用“今日无更新”，items 返回空数组。

Edges:
  - From: START
    To: summarize
  - From: summarize
    To: END

Branches: []
