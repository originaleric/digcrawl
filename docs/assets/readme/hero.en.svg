.muted{fill:var(--muted)}.accent{fill:var(--accent)}.mono{font-family:'SFMono-Regular',Consolas,monospace}.line{stroke:var(--line);fill:none}.flow{stroke:var(--accent);fill:none;stroke-width:2.5}
</style><rect x="1" y="1" width="1198" height="478" rx="24" fill="var(--bg)" stroke="var(--line)"/><text x="48" y="60" font-size="15" font-weight="600" class="accent mono">DIGCRAWL / CONTENT RETRIEVAL</text><text x="48" y="150" font-size="48" font-weight="750" class="">Get the content.</text><text x="48" y="222" font-size="48" font-weight="750" class="">Give it to your agent.</text><text x="48" y="280" font-size="21" font-weight="400" class="muted">Pages, posts, images, and video.</text><text x="48" y="313" font-size="21" font-weight="400" class="muted">Public content and your signed-in sources.</text><path d="M48 352H515" class="line"/><text x="48" y="393" font-size="17" font-weight="600" class="mono">LOCAL SESSIONS</text><text x="230" y="393" font-size="17" font-weight="600" class="mono">PLATFORM READERS</text><text x="48" y="426" font-size="16" font-weight="400" class="muted">Your sessions. Your access permissions.</text><path d="M562 48V432" class="line"/><defs><marker id="agent-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="598" y="160" width="162" height="56" rx="12" fill="var(--surface)" stroke="var(--line)"/><text x="679" y="195" text-anchor="middle" font-size="18" font-weight="550" class="">Web &amp; articles</text><rect x="598" y="248" width="162" height="56" rx="12" fill="var(--surface)" stroke="var(--line)"/><text x="679" y="283" text-anchor="middle" font-size="18" font-weight="550" class="">Images &amp; posts</text><rect x="598" y="336" width="162" height="56" rx="12" fill="var(--surface)" stroke="var(--line)"/><text x="679" y="371" text-anchor="middle" font-size="18" font-weight="550" class="">Video &amp; captions</text><g id="source-connections" stroke-linejoin="round" stroke-linecap="round"><path d="M760 188H780Q790 188 790 198V246Q790 256 800 256H81