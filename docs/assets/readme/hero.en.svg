<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">DigCrawl content retrieval</title><desc id="desc">DigCrawl retrieves pages, posts, images and video for AI agents using user-authorized sessions.</desc><style>
:root{--bg:#f7f7f7;--surface:#fff;--text:#111318;--muted:#59636f;--line:#d8dfe7;--accent:#0071e3;--tint:#eaf4ff;--soft:#f0f3f6}
@media(prefers-color-scheme:dark){:root{--bg:#080a0d;--surface:#11161d;--text:#f4f7fa;--muted:#a7b0ba;--line:#303b49;--accent:#4fb3ff;--tint:#10263e;--soft:#18212c}}
