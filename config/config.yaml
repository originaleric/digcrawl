Gateway:
  ListenAddr: "127.0.0.1:8787"
  InstanceID: "digcrawl-local"
  AuthToken: ""
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - x.post.read
  AllowedReadPaths: []
  AllowedDomains: []
  ArtifactEnabled: true
  ArtifactDir: "storage/digcrawl/artifacts"
  ArtifactTTLMinutes: 60
  RequireApproval: true

Collector:
  ServerURL: ""
  WSPath: "/digcrawl/v1/collector/ws"
  Token: ""
  InstanceID: ""
  HeartbeatIntervalSec: 30
  PullIntervalSec: 0
  PullBatchSize: 1
  ReconnectDelaySec: 5
  MaxConcurrentCalls: 1
  RateLimitCooldownMs: 1000
  CallQueueSize: 32
  CallQueueWaitMs: 30000
  RetryMaxAttempts: 2
  RetryDelayMs: 1500
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - x.post.read

Collect:
  OutputDir: "collect-output"
  InboxDir: "collect-inbox"
  DefaultFormats: ["md", "json"]
  # 持久化方案：files | index | sqlite | both
  PersistMode: index
  DBPath: "storage/digcrawl/collect.db"
  IncludeMedia: true
  DownloadMedia: true
  IndexEnabled: true
  MaxMediaBytes: 10485760
  MediaTimeoutSec: 30
  InboxPollIntervalSec: 5
  RateLimitMs: 1500
  PlatformRateLimits:
    xiaohongshu: 2000
    douyin: 2500
    toutiao: 2000

LocalBrowser:
  Enabled: true
  MaxConcurrency: 2
  TotalTimeoutSec: 90
  NavigateTimeoutSec: 45
  WaitSelectorTimeoutSec: 25
  AllowedDomains:
    - mp.weixin.qq.com
    - weixin.qq.com
    - xiaohongshu.com
    - www.xiaohongshu.com
    - edith.xiaohongshu.com
    - xhslink.com
    - douyin.com
    - www.douyin.com
    - iesdouyin.com
    - v.douyin.com
    - toutiao.com
    - www.toutiao.com
    - m.toutiao.com
    - x.com
    - twitter.com
    - www.twitter.com
  ChromePath: ""
  Headless: true
  CookieStoreDir: "storage/digcrawl/browser_cookies"
  CDPMode: false
  CDPPort: 9222
  CDPConnectExisting: false
  UserDataDir: ""
  ProxyURL: ""

Platform:
  BrowseRetryMaxAttempts: 2
  BrowseRetryDelayMs: 800
  ReadMetricsEnabled: true
  HealthProbes: {}
  X:
    APIEnabled: true
    OEmbedEnabled: true
    AuthMode: "app_only"
    APIBaseURL: "https://api.twitter.com"
    TokenURL: "https://api.twitter.com/oauth2/token"
    OEmbedURL: "https://publish.twitter.com/oembed"
    ConsumerKey: "r3lDvHngF1lLm9nbKABcpieHt"
    ConsumerKeySecret: "DdQgNA7LVBByIAlQTMniEwH4r42dFIfCtpOTxPyWjhTIZe21WI"
    BearerToken: ""
    APITimeoutSec: 8
    APIMaxRetries: 1

OCR:
  Enabled: false
  # openai_compatible | zhipu_ocr | stub
  Provider: "openai_compatible"
  APIKey: ""
  # zhipu_ocr 默认使用 https://open.bigmodel.cn/api/paas/v4 和 glm-ocr。
  BaseURL: "https://api.openai.com/v1"
  Model: "gpt-4o-mini"
  Prompt: "Extract all readable text from this image. Return only the OCR text. Preserve line breaks when useful."
  TimeoutSec: 30
  MaxImages: 8
  MaxImageBytes: 5242880
  MaxTokens: 1200
  AppendToMarkdown: true
  AppendToText: false

Providers:
  ExampleEnabled: true
  PlatformEnabled: true
  BrowserEnabled: true
  StubEnabled: false
