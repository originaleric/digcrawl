Gateway:
  ListenAddr: "127.0.0.1:8787"
  InstanceID: "digcrawl-local"
  AuthToken: ""
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - toutiao.video.read
    - feed.read
    - bilibili.video.read
    - weibo.post.read
    - kuaishou.video.read
    - zhihu.content.read
    - youtube.video.read
    - x.post.read
    - reddit.post.read
    - reddit.subreddit.read
    - reddit.user.read
    - threads.post.read
    - instagram.content.read
    - asr.transcribe
  AllowedReadPaths: []
  AllowedDomains: []
  ArtifactEnabled: true
  ArtifactDir: "storage/digcrawl/artifacts"
  ArtifactTTLMinutes: 60
  ArtifactMaxInlineBytes: 10485760
  RequireApproval: true

Collector:
  ServerURL: ""
  WSPath: "/digcrawl/v1/collector/ws"
  Token: ""
  InstanceID: ""
  HeartbeatIntervalSec: 30
  PullIntervalSec: 0
  PullBatchSize: 1
  ReconnectDelaySec: 5
  MaxConcurrentCalls: 1
  RateLimitCooldownMs: 1000
  CallQueueSize: 32
  CallQueueWaitMs: 30000
  RetryMaxAttempts: 2
  RetryDelayMs: 1500
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - toutiao.video.read
    - feed.read
    - bilibili.video.read
    - weibo.post.read
    - kuaishou.video.read
    - zhihu.content.read
    - youtube.video.read
    - x.post.read
    - reddit.post.read
    - reddit.subreddit.read
    - reddit.user.read
    - threads.post.read
    - instagram.content.read
    - asr.transcribe

Collect:
  OutputDir: "collect-output"
  InboxDir: "collect-inbox"
  DefaultFormats: ["md", "json"]
  # 持久化方案：files | index | sqlite | both
  PersistMode: index
  DBPath: "storage/digcrawl/collect.db"
  IncludeMedia: true
  DownloadMedia: true
  IndexEnabled: true
  MaxMediaBytes: 10485760
  MediaTimeoutSec: 30
  InboxPollIntervalSec: 5
  RateLimitMs: 1500
  PlatformRateLimits:
    xiaohongshu: 2000
    douyin: 2500
    toutiao: 2000
    reddit: 2500

LocalBrowser:
  Enabled: true
  MaxConcurrency: 2
  TotalTimeoutSec: 90
  NavigateTimeoutSec: 45
  WaitSelectorTimeoutSec: 25
  AllowedDomains:
    - mp.weixin.qq.com
    - weixin.qq.com
    - xiaohongshu.com
    - www.xiaohongshu.com
    - edith.xiaohongshu.com
    - xhslink.com
    - douyin.com
    - www.douyin.com
    - iesdouyin.com
    - v.douyin.com
    - toutiao.com
    - www.toutiao.com
    - m.toutiao.com
    - bilibili.com
    - www.bilibili.com
    - m.bilibili.com
    - space.bilibili.com
    - b23.tv
    - weibo.com
    - www.weibo.com
    - m.weibo.cn
    - kuaishou.com
    - www.kuaishou.com
    - v.kuaishou.com
    - zhihu.com
    - www.zhihu.com
    - zhuanlan.zhihu.com
    - youtube.com
    - www.youtube.com
    - m.youtube.com
    - youtu.be
    - www.youtu.be
    - x.com
    - twitter.com
    - www.twitter.com
    - reddit.com
    - www.reddit.com
    - old.reddit.com
    - new.reddit.com
    - redd.it
    - threads.net
    - www.threads.net
    - threads.com
    - www.threads.com
    - instagram.com
    - www.instagram.com
  # 留空时自动发现当前可用的 Playwright Chromium / 本机 Chrome。
  # 不要写入 chromium_headless_shell-xxxx 这类 Playwright 缓存路径：版本升级会替换目录。
  ChromePath: ""
  Headless: true
  CookieStoreDir: "storage/digcrawl/browser_cookies"
  CDPMode: false
  CDPPort: 9222
  CDPConnectExisting: false
  UserDataDir: ""
  ProxyURL: ""
  ExtraArgs:
    - "--single-process"
    - "--no-zygote"
    - "--disable-crash-reporter"
    - "--disable-crashpad"
    - "--no-sandbox"

RuntimeEnv:
  # 是否从 config/runtime-env.yml 显式注入运行时变量。
  # 用于 DigFlow embedded runtime 模板中的 ${DIGCRAWL_MYSQL_*}、${DIGFLOW_SUMMARY_API_KEY} 等。
  Enabled: false
  ConfigPath: "config/runtime-env.yml"
  Variables: {}

Platform:
  BrowseRetryMaxAttempts: 2
  BrowseRetryDelayMs: 800
  ReadMetricsEnabled: true
  HealthProbes: {}
  X:
    APIEnabled: true
    OEmbedEnabled: true
    AuthMode: "app_only"
    APIBaseURL: "https://api.twitter.com"
    TokenURL: "https://api.twitter.com/oauth2/token"
    OEmbedURL: "https://publish.twitter.com/oembed"
    ConsumerKey: "r3lDvHngF1lLm9nbKABcpieHt"
    ConsumerKeySecret: "DdQgNA7LVBByIAlQTMniEwH4r42dFIfCtpOTxPyWjhTIZe21WI"
    BearerToken: ""
    APITimeoutSec: 8
    APIMaxRetries: 1
  Reddit:
    APIEnabled: true
    ClientID: "${REDDIT_CLIENT_ID}"
    ClientSecret: "${REDDIT_CLIENT_SECRET}"
    RefreshToken: "${REDDIT_REFRESH_TOKEN}"
    UserAgent: "digcrawl/1.0"
    OAuthMode: "client_credentials"
    APIBaseURL: "https://oauth.reddit.com"
    TokenURL: "https://www.reddit.com/api/v1/access_token"
    APITimeoutSec: 10
    APIMaxRetries: 1
    RateLimit:
      RequestsPerMinute: 60
      HeaderDriven: true
      BackoffOn429: true
      MinRetryAfterSec: 30
    Comments:
      DefaultLimit: 50
      DefaultDepth: 3
      DefaultSort: "confidence"
      ExpandMore: false
      ExpandMoreLimit: 0
    BrowserFallback:
      Enabled: true
      AllowWithoutOAuth: false

Social:
  Threads:
    AuthMode: "public"
    BrowserFallback: false
    RequestTimeoutSec: 30
  Instagram:
    AuthMode: "public"
    BrowserFallback: false
    RequestTimeoutSec: 30
    RateLimitMs: 5000

OCR:
  Enabled: false
  # openai_compatible | stub
  Provider: "openai_compatible"
  APIKey: ""
  BaseURL: "https://api.openai.com/v1"
  Model: "gpt-4o-mini"
  Prompt: "Extract all readable text from this image. Return only the OCR text. Preserve line breaks when useful."
  TimeoutSec: 30
  MaxImages: 8
  MaxImageBytes: 5242880
  MaxTokens: 1200
  AppendToMarkdown: true
  AppendToText: false
  # Optional local-video subtitle OCR. This is disabled by default. When OCR
  # uses a remote provider, extracted frames are sent to that provider.
  VideoFrames:
    Enabled: false
    # Sample one frame every N seconds, then stop at MaxFrames.
    IntervalSec: 5
    MaxFrames: 8
    # Total frame limit across all videos in one collected item.
    MaxTotalFrames: 16
    # Maximum local ffmpeg runtime for one downloaded video.
    TimeoutSec: 120
    # Leave empty to use ffmpeg from PATH.
    FFmpegPath: ""
    # Leave empty to use a private system temporary directory.
    TempDir: ""

ASR:
  Enabled: true
  # api | local | stub
  # api 使用 OpenAI-compatible /audio/transcriptions；local 使用 faster-whisper/whisper.cpp 等本地命令。
  Provider: "local"
  APIKey: ""
  BaseURL: "https://api.openai.com/v1"
  # 留空时根据 Provider 选择默认模型：api=whisper-1，local=small。
  Model: "small"
  Language: ""
  Prompt: ""
  ResponseFormat: "verbose_json"
  TimeoutSec: 300
  # Hard cap for a single local ASR operation. Increase for videos over about 15 minutes.
  MaxTimeoutSec: 1800
  FFmpegPath: "${DIGCRAWL_FFMPEG_PATH}"
  # 本地 faster-whisper 模型缓存；生产环境应使用持久目录，doctor 会离线验证模型可加载。
  ModelCacheDir: "storage/digcrawl/asr_models"
  TempDir: ""
  AudioSampleRate: 16000
  MaxAudioBytes: 26214400
  # Leave LocalCommand/LocalArgs unset for the portable default: use the
  # faster-whisper command when installed, otherwise DigCrawl's bundled runner.
  # Set both only when intentionally using a custom Python environment/script.

Watchlist:
  Enabled: true
  DryRun: false
  DefaultInterval: "6h"
  Scheduler:
    Enabled: true
    TickInterval: "5m"
    Jitter: "30s"
  # Source.Mode:
  #   yaml     - 从下方 Items 和根级 Tasks 读取，适合少量本地配置和兼容旧配置。
  #   database - 从 dc_watchlist_sources 读取，适合长期维护的大清单。
  #   mixed    - 同时读取 YAML 和数据库；同 ID 时数据库覆盖 YAML。
  Source:
    Mode: database
  NotifyOnFirstRun: true
  MaxItemsPerRun: 2
  LockTTL: "30m"
  Persistence:
    # sqlite | mysql。source 清单和 runtime 状态共用该持久化后端。
    Driver: mysql
    SQLitePath: ""
    # Driver=mysql 时可二选一：
    # MySQLDSN: "${DIGCRAWL_MYSQL_DSN}"
    GormConfigPath: "config/gorm.yml"
  # Deprecated: kept for old configs; new configs should use Persistence.SQLitePath.
  DBPath: "storage/digcrawl/collect.db"
  Items: []
  # 示例：
  # Items:
  #   - ID: toutiao-author-example
  #     Platform: toutiao
  #     Type: author
  #     URL: https://www.toutiao.com/c/user/token/...
  #     Name: 某头条作者
  #     Interval: 6h
  #     NotifyTo: feishu-default
  #     Enabled: true
  #   - ID: reddit-subreddit-example
  #     Platform: reddit
  #     Type: reddit_subreddit
  #     URL: https://www.reddit.com/r/LocalLLaMA/new/
  #     Name: r/LocalLLaMA
  #     Interval: 6h
  #     NotifyTo: feishu-default
  #     Enabled: true
  #     Options:
  #       Sort: new
  #       Limit: 25
  #       IncludeComments: false

# Tasks 仅保留为 YAML 模式的兼容入口。当前 Source.Mode=database，
# Watchlist 清单和调度都以 dc_watchlist_sources 为唯一来源。
Tasks: []
# 示例：
# Tasks:
#   - ID: reddit-ai-watch
#     Name: Reddit AI 社区监控
#     Type: watchlist.collect
#     Enabled: true
#     Schedule:
#       Mode: interval
#       Every: 6h
#       # 或使用每日固定时间：
#       # Mode: daily
#       # At: "09:00"
#     Source:
#       Platform: reddit
#       Kind: reddit_subreddit
#       URL: https://www.reddit.com/r/artificial/new/
#       Options:
#         sort: new
#         limit: 25
#     Notify:
#       Channel: feishu-default

Summary:
  Enabled: true
  # extractive | llm_direct | digflow_runtime | digflow_http
  Provider: "digflow_runtime"
  TimeoutSec: 60
  MaxInputChars: 30000
  ImportanceThreshold: "medium"
  FallbackProvider: "extractive"
  Mode: "per_item_and_digest"
  InputBudget:
    TextChars: 12000
    ASRChars: 12000
    OCRChars: 4000
    MetadataChars: 2000
  DigFlow:
    # embedded 使用 DigCrawl 进程内 DigFlow.runtime；http 保留远程兼容路径。
    RuntimeMode: "embedded"
    RootDir: "."
    ConfigPath: "config/digflow.yml"
    GormConfigPath: "config/digflow-gorm.yml"
    EinoConfigPath: "config/eino.yml"
    ManifestPath: "agents/watchlist/agents.yml"
    GlobalToolsPath: "config/global_tools.yml"
    GlobalSkillsDir: "skills"
    DisableCheckpoint: true
    BaseURL: "http://127.0.0.1:20201"
    Endpoint: "/api/v1/invoke"
    Agent: "watchlist_summary_agent"
    AuthToken: "${DIGFLOW_API_TOKEN}"
  LLM:
    APIKey: ""
    BaseURL: "https://api.openai.com/v1"
    Model: "gpt-4o-mini"

Notifications:
  Feishu:
    Enabled: true
    DefaultChannel: "feishu-default"
    ConfigPath: "config/feishu.yml"
    Channels:
      - ID: "feishu-default"
        WebhookURL: "${FEISHU_WEBHOOK_URL}"
        Secret: "${FEISHU_WEBHOOK_SECRET}"
        TimeoutSec: 10
        MaxMessageChars: 12000

Providers:
  ExampleEnabled: true
  PlatformEnabled: true
  BrowserEnabled: true
  ASREnabled: true
  StubEnabled: false
