Gateway:
  ListenAddr: "127.0.0.1:8787"
  InstanceID: "digcrawl-local"
  AuthToken: ""
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - x.post.read
    - asr.transcribe
  AllowedReadPaths: []
  AllowedDomains: []
  ArtifactEnabled: true
  ArtifactDir: "storage/digcrawl/artifacts"
  ArtifactTTLMinutes: 60
  RequireApproval: true

Collector:
  ServerURL: ""
  WSPath: "/digcrawl/v1/collector/ws"
  Token: ""
  InstanceID: ""
  HeartbeatIntervalSec: 30
  PullIntervalSec: 0
  PullBatchSize: 1
  ReconnectDelaySec: 5
  MaxConcurrentCalls: 1
  RateLimitCooldownMs: 1000
  CallQueueSize: 32
  CallQueueWaitMs: 30000
  RetryMaxAttempts: 2
  RetryDelayMs: 1500
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - x.post.read
    - asr.transcribe

Collect:
  OutputDir: "collect-output"
  InboxDir: "collect-inbox"
  DefaultFormats: ["md", "json"]
  # 持久化方案：files | index | sqlite | both
  PersistMode: index
  DBPath: "storage/digcrawl/collect.db"
  IncludeMedia: true
  DownloadMedia: true
  IndexEnabled: true
  MaxMediaBytes: 10485760
  MediaTimeoutSec: 30
  InboxPollIntervalSec: 5
  RateLimitMs: 1500
  PlatformRateLimits:
    xiaohongshu: 2000
    douyin: 2500
    toutiao: 2000

LocalBrowser:
  Enabled: true
  MaxConcurrency: 2
  TotalTimeoutSec: 90
  NavigateTimeoutSec: 45
  WaitSelectorTimeoutSec: 25
  AllowedDomains:
    - mp.weixin.qq.com
    - weixin.qq.com
    - xiaohongshu.com
    - www.xiaohongshu.com
    - edith.xiaohongshu.com
    - xhslink.com
    - douyin.com
    - www.douyin.com
    - iesdouyin.com
    - v.douyin.com
    - toutiao.com
    - www.toutiao.com
    - m.toutiao.com
    - x.com
    - twitter.com
    - www.twitter.com
  ChromePath: ""
  Headless: true
  CookieStoreDir: "storage/digcrawl/browser_cookies"
  CDPMode: false
  CDPPort: 9222
  CDPConnectExisting: false
  UserDataDir: ""
  ProxyURL: ""

Platform:
  BrowseRetryMaxAttempts: 2
  BrowseRetryDelayMs: 800
  ReadMetricsEnabled: true
  HealthProbes: {}
  X:
    APIEnabled: true
    OEmbedEnabled: true
    AuthMode: "app_only"
    APIBaseURL: "https://api.twitter.com"
    TokenURL: "https://api.twitter.com/oauth2/token"
    OEmbedURL: "https://publish.twitter.com/oembed"
    ConsumerKey: "r3lDvHngF1lLm9nbKABcpieHt"
    ConsumerKeySecret: "DdQgNA7LVBByIAlQTMniEwH4r42dFIfCtpOTxPyWjhTIZe21WI"
    BearerToken: ""
    APITimeoutSec: 8
    APIMaxRetries: 1

OCR:
  Enabled: false
  # openai_compatible | zhipu_ocr | stub
  Provider: "openai_compatible"
  APIKey: ""
  # zhipu_ocr 默认使用 https://open.bigmodel.cn/api/paas/v4 和 glm-ocr。
  BaseURL: "https://api.openai.com/v1"
  Model: "gpt-4o-mini"
  Prompt: "Extract all readable text from this image. Return only the OCR text. Preserve line breaks when useful."
  TimeoutSec: 30
  MaxImages: 8
  MaxImageBytes: 5242880
  MaxTokens: 1200
  AppendToMarkdown: true
  AppendToText: false

ASR:
  Enabled: false
  # api | local | stub
  # api 使用 OpenAI-compatible /audio/transcriptions；local 使用 faster-whisper/whisper.cpp 等本地命令。
  Provider: "api"
  APIKey: ""
  BaseURL: "https://api.openai.com/v1"
  # 留空时根据 Provider 选择默认模型：api=whisper-1，local=small。
  Model: ""
  Language: ""
  Prompt: ""
  ResponseFormat: "verbose_json"
  TimeoutSec: 300
  FFmpegPath: "ffmpeg"
  TempDir: ""
  AudioSampleRate: 16000
  MaxAudioBytes: 26214400
  LocalCommand: "faster-whisper"
  # 留空时默认执行：
  # faster-whisper <audio_path> --model <model> --output_format json --output_dir <output_dir>
  # 可使用占位符：{audio_path} {model} {language} {output_dir}
  LocalArgs: []

Watchlist:
  Enabled: false
  DryRun: false
  DefaultInterval: "6h"
  NotifyOnFirstRun: false
  MaxItemsPerRun: 20
  LockTTL: "30m"
  DBPath: "storage/digcrawl/collect.db"
  Items: []
  # 示例：
  # Items:
  #   - ID: toutiao-author-example
  #     Platform: toutiao
  #     Type: author
  #     URL: https://www.toutiao.com/c/user/token/...
  #     Name: 某头条作者
  #     Interval: 6h
  #     NotifyTo: feishu-default
  #     Enabled: true

Summary:
  Enabled: false
  # extractive | llm_direct | digflow_runtime | digflow_http
  Provider: "extractive"
  TimeoutSec: 60
  MaxInputChars: 30000
  ImportanceThreshold: "medium"
  FallbackProvider: "extractive"
  Mode: "per_item_and_digest"
  InputBudget:
    TextChars: 12000
    ASRChars: 12000
    OCRChars: 4000
    MetadataChars: 2000
  DigFlow:
    # embedded 使用 DigCrawl 进程内 DigFlow.runtime；http 保留远程兼容路径。
    RuntimeMode: "embedded"
    RootDir: "."
    ConfigPath: "config/digflow.yml"
    GormConfigPath: "config/digflow-gorm.yml"
    EinoConfigPath: "config/eino.yml"
    ManifestPath: "agents/watchlist/agents.yml"
    GlobalToolsPath: "config/global_tools.yml"
    GlobalSkillsDir: "skills"
    DisableCheckpoint: true
    BaseURL: "http://127.0.0.1:20201"
    Endpoint: "/api/v1/invoke"
    Agent: "watchlist_summary_agent"
    AuthToken: "${DIGFLOW_API_TOKEN}"
  LLM:
    APIKey: ""
    BaseURL: "https://api.openai.com/v1"
    Model: "gpt-4o-mini"

Notifications:
  Feishu:
    Enabled: false
    DefaultChannel: "feishu-default"
    Channels:
      - ID: "feishu-default"
        WebhookURL: "${FEISHU_WEBHOOK_URL}"
        Secret: "${FEISHU_WEBHOOK_SECRET}"
        TimeoutSec: 10
        MaxMessageChars: 12000

Providers:
  ExampleEnabled: true
  PlatformEnabled: true
  BrowserEnabled: true
  ASREnabled: true
  StubEnabled: false
