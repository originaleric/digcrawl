Gateway:
  ListenAddr: "127.0.0.1:8787"
  InstanceID: "digcrawl-local"
  AuthToken: ""
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - x.post.read
  AllowedReadPaths: []
  AllowedDomains: []
  ArtifactEnabled: true
  ArtifactDir: "storage/digcrawl/artifacts"
  ArtifactTTLMinutes: 60
  RequireApproval: true

Collector:
  ServerURL: ""
  WSPath: "/digcrawl/v1/collector/ws"
  Token: ""
  InstanceID: ""
  HeartbeatIntervalSec: 30
  PullIntervalSec: 0
  PullBatchSize: 1
  ReconnectDelaySec: 5
  MaxConcurrentCalls: 1
  RateLimitCooldownMs: 1000
  CallQueueSize: 32
  CallQueueWaitMs: 30000
  RetryMaxAttempts: 2
  RetryDelayMs: 1500
  AllowedTools:
    - gateway.ping
    - browser.browse
    - browser.snapshot
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - x.post.read

Collect:
  OutputDir: "collect-output"
  InboxDir: "collect-inbox"
  DefaultFormats: ["md", "json"]
  # 持久化方案：files | index | sqlite | both
  PersistMode: index
  DBPath: "storage/digcrawl/collect.db"
  IncludeMedia: true
  DownloadMedia: true
  IndexEnabled: true
  MaxMediaBytes: 10485760
  MediaTimeoutSec: 30
  InboxPollIntervalSec: 5
  RateLimitMs: 1500
  PlatformRateLimits:
    xiaohongshu: 2000
    douyin: 2500
    toutiao: 2000

LocalBrowser:
  Enabled: true
  MaxConcurrency: 2
  TotalTimeoutSec: 90
  NavigateTimeoutSec: 45
  WaitSelectorTimeoutSec: 25
  AllowedDomains:
    - mp.weixin.qq.com
    - weixin.qq.com
    - xiaohongshu.com
    - www.xiaohongshu.com
    - edith.xiaohongshu.com
    - xhslink.com
    - douyin.com
    - www.douyin.com
    - iesdouyin.com
    - v.douyin.com
    - toutiao.com
    - www.toutiao.com
    - m.toutiao.com
    - x.com
    - twitter.com
    - www.twitter.com
  ChromePath: ""
  Headless: true
  CookieStoreDir: "storage/digcrawl/browser_cookies"
  CDPMode: false
  CDPPort: 9222
  CDPConnectExisting: false
  UserDataDir: ""
  ProxyURL: ""

Platform:
  BrowseRetryMaxAttempts: 2
  BrowseRetryDelayMs: 800
  ReadMetricsEnabled: true
  HealthProbes: {}

Providers:
  ExampleEnabled: true
  PlatformEnabled: true
  BrowserEnabled: true
  StubEnabled: false
