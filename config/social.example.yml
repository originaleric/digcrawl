Social:
  Threads:
    # public | local_session
    # public: default, do not load local browser cookies.
    # local_session: allow watchlist sources that explicitly set
    # options.auth_mode=local_session to reuse local browser cookies.
    AuthMode: "public"
    BrowserFallback: false
    RequestTimeoutSec: 30
  Instagram:
    # public | local_session
    AuthMode: "public"
    BrowserFallback: false
    RequestTimeoutSec: 30
    RateLimitMs: 5000

# Example source-level opt-in. Keep real watchlist items in YAML only for
# small local lists; use dc_watchlist_sources for long-term maintenance.
# Watchlist:
#   Items:
