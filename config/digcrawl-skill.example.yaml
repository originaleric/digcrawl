# Minimal local profile for the Phase 1 digcrawl Skill.
# Copy it outside the repository, then pass its absolute path to `digcrawl mcp`.
Gateway:
  InstanceID: "digcrawl-skill-local"
  # Leave empty to read any http/https page. Add domains only when an
  # operator wants to restrict DigCrawl to a smaller approved set.
  AllowedDomains: []
  AllowedTools:
    - gateway.ping
    - browser.browse
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - toutiao.video.read
    - bilibili.video.read
    - weibo.post.read
    - kuaishou.video.read
    - zhihu.content.read
    - x.post.read
    - reddit.post.read
    - reddit.subreddit.read
    - reddit.user.read
    - threads.post.read
    - instagram.content.read
    - feed.read
  # Screenshots are stored locally and returned in the same MCP response.
  # ArtifactMaxInlineBytes is the maximum attachment size; its default is
  # 10 MiB. Expired artifacts are removed automatically. Replace this with a
  # user-owned absolute directory.
  ArtifactEnabled: true
  ArtifactDir: "/absolute/path/to/digcrawl/artifacts"
  ArtifactTTLMinutes: 1440
  ArtifactMaxInlineBytes: 10485760
  RequireApproval: true

# The default LocalBrowser allowlist covers DigCrawl's built-in platforms.
# Replace the placeholder with a user-owned absolute path before first login.
LocalBrowser:
  CookieStoreDir: "/absolute/path/to/digcrawl/browser_cookies"

# Explicit Skill enrichment is configured independently from collect. The Agent
# normally summarizes returned Markdown/OCR/ASR itself. It only requests
# include_ocr/include_asr/include_summary when the user explicitly asks for
# that local capability; providers and keys stay in this local profile.
Skill:
  Media:
    DownloadMedia: false
    # Required only for explicit OCR/ASR/summary when DownloadMedia is true.
    # Replace with a user-owned absolute directory.
    Dir: "/absolute/path/to/digcrawl/skill-media"
    MaxBytes: 10485760
    TimeoutSec: 30
  OCR:
    Enabled: false
    # openai_compatible | stub
    Provider: "openai_compatible"
    APIKey: ""
    BaseURL: "https://api.openai.com/v1"
    Model: "gpt-4o-mini"
    Prompt: "Extract all readable text from this image. Return only the OCR text. Preserve line breaks when useful."
    TimeoutSec: 30
    MaxImages: 8
    MaxImageBytes: 5242880
    MaxTokens: 1200
    AppendToMarkdown: true
    AppendToText: false
  ASR:
    # Operational settings mirror the root OCR/ASR settings used by Collect.
    # Enabled remains false so the Skill stays explicit opt-in.
    Enabled: false
    # api | local | stub
    # api uses OpenAI-compatible /audio/transcriptions; local uses faster-whisper/whisper.cpp.
    Provider: "local"
    APIKey: ""
    BaseURL: "https://api.openai.com/v1"
    # The default model is whisper-1 for api and small for local.
    Model: "small"
    Language: ""
    Prompt: ""
    ResponseFormat: "verbose_json"
    TimeoutSec: 300
    FFmpegPath: "${DIGCRAWL_FFMPEG_PATH}"
    TempDir: ""
    AudioSampleRate: 16000
    MaxAudioBytes: 26214400
    LocalCommand: ".venv-asr/bin/python"
    LocalArgs:
      - "scripts/faster_whisper_asr.py"
      - "{audio_path}"
      - "--model"
      - "{model}"
      - "--output_format"
      - "json"
      - "--output_dir"
      - "{output_dir}"
  Summary:
    # Keep disabled unless an operator explicitly needs DigCrawl's local LLM
    # fallback. Host Agents should normally summarize returned content instead.
    Enabled: false
    TimeoutSec: 60
    MaxInputChars: 30000
    InputBudget:
      TextChars: 12000
      ASRChars: 12000
      OCRChars: 4000
    LLM:
      APIKey: ""
      BaseURL: "https://api.openai.com/v1"
      Model: "gpt-4o-mini"

# These root settings remain available to the existing CLI/collect workflow.
OCR:
  Enabled: false

Providers:
  ExampleEnabled: true
  PlatformEnabled: true
  BrowserEnabled: true
  ASREnabled: false
