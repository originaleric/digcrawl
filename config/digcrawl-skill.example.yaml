# Minimal local profile for the open-source digcrawl Skill.
# Copy it outside the repository, then pass its absolute path to `digcrawl mcp`.
Gateway:
  InstanceID: "digcrawl-skill-local"
  # Leave empty to read any http/https page. Add domains only when an
  # operator wants to restrict DigCrawl to a smaller approved set.
  AllowedDomains: []
  AllowedTools:
    - gateway.ping
    # One-time, confirmation-protected switch for local video ASR.
    - skill.asr.enable
    # Updates explicit provider-video retention or legacy Skill.Media settings
    # after an explicit user request; it never changes credentials.
    - skill.media.configure
    - browser.browse
    - wechat.article.read
    - xiaohongshu.note.read
    - douyin.video.read
    - toutiao.article.read
    - toutiao.video.read
    - bilibili.video.read
    - weibo.post.read
    - kuaishou.video.read
    - zhihu.content.read
    - youtube.video.read
    - x.post.read
    - reddit.post.read
    - reddit.subreddit.read
    - reddit.user.read
    - threads.post.read
    - instagram.content.read
    - feed.read
  # Screenshots are stored locally and returned in the same MCP response.
  # ArtifactMaxInlineBytes is the maximum attachment size; its default is
  # 10 MiB. Expired artifacts are removed automatically. Replace this with a
  # user-owned absolute directory.
  ArtifactEnabled: true
  ArtifactDir: "/absolute/path/to/digcrawl/artifacts"
  ArtifactTTLMinutes: 1440
  ArtifactMaxInlineBytes: 10485760
  RequireApproval: true

# The default LocalBrowser allowlist covers DigCrawl's built-in platforms.
# Replace the placeholder with a user-owned absolute path before first login.
LocalBrowser:
  CookieStoreDir: "/absolute/path/to/digcrawl/browser_cookies"
  # Optional: connect to the persistent Chrome started by
  # scripts/digcrawl-cdp-browser-service.sh. This avoids any dependency on
  # Playwright's versioned browser cache.
  # CDPMode: true
  # CDPConnectExisting: true
  # CDPPort: 9323

# The open-source Skill uses the host Agent's native vision and model for image
# reading and summaries. This profile therefore has no OCR or LLM API key.
# Only video ASR remains a local optional capability.
#
# Explicit provider-video persistence. Keep Providers empty by default: a
# supported platform saves a video only after the user opts that provider in.
# The configured directory must be absolute in a copied profile.
VideoDownload:
  Dir: "/absolute/path/to/digcrawl/videos"
  Providers: {}
  MaxBytes: 536870912
  TimeoutSec: 300

# Explicit provider-image persistence. This is independent from image OCR and
# Collect assets: enable only the providers whose original images you want to
# retain in a private local directory.
ImageDownload:
  Dir: "/absolute/path/to/digcrawl/images"
  Providers: {}
  MaxBytes: 10485760
  MaxItems: 8
  TimeoutSec: 60

Skill:
  Media:
    DownloadMedia: false

    # Compatibility setting for pre-VideoDownload profiles' YouTube
    # enrichment path. New provider retention uses VideoDownload above.
    RetainDownloadedVideo: false
    # `digcrawl init --profile skill` generates an OS-native absolute
    # directory beside the user profile. This copied example needs a
    # user-owned absolute directory instead.
    Dir: "/absolute/path/to/digcrawl/skill-media"
    MaxBytes: 134217728
    TimeoutSec: 120
    # Number of video/audio candidates tried for ASR: primary plus one fallback.
    MaxASRCandidates: 2
  ASR:
    # Operational settings mirror the root OCR/ASR settings used by Collect.
    # Enabled remains false so the Skill stays explicit opt-in.
    Enabled: false
    # api | local | stub
    # api uses OpenAI-compatible /audio/transcriptions; local uses faster-whisper/whisper.cpp.
    Provider: "local"
    BaseURL: "https://api.openai.com/v1"
    # The default model is whisper-1 for api and small for local.
    Model: "small"
    Language: ""
    Prompt: ""
    ResponseFormat: "verbose_json"
    TimeoutSec: 300
    # Hard cap for one local ASR operation; raise it for longer videos.
    MaxTimeoutSec: 1800
    FFmpegPath: "${DIGCRAWL_FFMPEG_PATH}"
    # Persistent directory containing locally prepared Whisper model files.
    # Relative paths are resolved from this profile's directory, never cwd.
    ModelCacheDir: "storage/digcrawl/asr_models"
    TempDir: ""
    AudioSampleRate: 16000
    MaxAudioBytes: 26214400
    # Leave LocalCommand/LocalArgs unset for the portable default: use the
    # faster-whisper command when installed, otherwise DigCrawl's bundled
    # runner with python3/python/py found on PATH. Set both only for a custom
    # Python environment/script; relative paths resolve from this profile.
# These root settings remain available to the existing CLI/collect workflow.
OCR:
  Enabled: false

Providers:
  ExampleEnabled: true
  PlatformEnabled: true
  BrowserEnabled: true
  # Registers skill.asr.enable; asr.transcribe remains outside AllowedTools.
  ASREnabled: true
